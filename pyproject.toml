[project]
name = "boku-nano"
version = "0.1.0"
description = "日本語の指示から限定的なPython関数を生成するSLMを、データ生成から評価までフルスクラッチで作る実習プロジェクト"
requires-python = ">=3.12"
# 依存の層は実装計画 §11 を参照。
#   boku/semantics, boku/interp, boku/probes  … 標準ライブラリのみ
#   scripts/                                  … ＋ hydra-core, mlflow
#   tests/                                    … ＋ pytest
# 意味の権威（参照インタプリタ・レジストリ）に外部ライブラリを持ち込まない。
# 境界は tests/test_core_has_no_external_deps.py で固定する。
dependencies = [
    "hydra-core>=1.3",
    "mlflow>=2.16",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# インストールせずリポジトリのルートから実行する。`boku` を import できるようにする。
pythonpath = ["."]
testpaths = ["tests"]
